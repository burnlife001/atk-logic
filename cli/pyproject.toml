[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atk-cli"
version = "0.1.0"
description = "ATK-Logic logic analyzer CLI (zero dependencies, stdlib only)"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
atk-cli = "atk_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
